[package]
name = "scribiva-desktop"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
description = "Scribiva desktop app: native Rust core for Windows and Linux"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-notification = "=2.8.0"
tauri-plugin-single-instance = "=2.5.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
url = "=2.5.8"
hound = "=3.5.1"
uuid = { version = "=1.29.0", features = ["v4"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json", "multipart", "http2"] }
# ring provider: aws-lc-sys (reqwest's default) needs a per-target C toolchain; ring is the
# other rustls-supported provider. Certificates are verified against the OS store
# (rustls-platform-verifier). No OpenSSL anywhere.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "=1.54.1", features = ["time", "sync"] }
# Windows Credential Manager / Linux Secret Service (zbus, pure-Rust crypto).
keyring = "=4.2.0"

[target.'cfg(windows)'.dependencies]
tauri-plugin-global-shortcut = "=2.4.1"
cpal = "=0.18.2"
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Session bus: GNOME extension (focus, InsertText, indicator), name checks.
zbus = "=5.19.0"
# SIGTERM for the pw-record child.
libc = "=0.2.191"

[profile.release]
codegen-units = 1
lto = true
strip = true
