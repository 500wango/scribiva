name: Release

# Tag push -> build + test installers -> DRAFT GitHub Release. Nothing is ever
# published automatically; a maintainer reviews the draft and publishes it by
# hand (docs/10-RELEASE-OPERATIONS.md, "CI 与发布流程").
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.96.1"
  NODE_VERSION: "24"

defaults:
  run:
    shell: bash

# No dependency caches in this workflow: release builds start from the lockfiles
# only, so a cache written by another branch cannot end up in a signed installer.
jobs:
  verify:
    name: Verify tag and version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches every version field
        id: version
        run: |
          python3 scripts/release/bump_version.py --check "$GITHUB_REF_NAME"
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"

      - name: Release script tests
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py'

  linux-deb:
    name: Linux .deb
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri 2 build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential pkg-config file patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libdbus-1-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: npm ci
        working-directory: desktop
        run: npm ci

      # Builds eitype =0.2.2 with `cargo install --locked` (EITYPE_BIN unset),
      # stages the GNOME extension and the license files.
      - name: Stage extension, eitype and licenses
        working-directory: desktop
        run: bash packaging/linux/stage.sh

      # The .deb is updated through the website/APT, not the in-app updater, so
      # no updater artifact (and no signing key) is involved here.
      - name: Build .deb
        working-directory: desktop
        run: |
          npx tauri build --ci --bundles deb \
            --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked

      - name: Collect artifact
        id: deb
        run: |
          shopt -s nullglob
          debs=(desktop/src-tauri/target/release/bundle/deb/*.deb)
          [ "${#debs[@]}" = 1 ] || { echo "::error::expected one .deb, found ${#debs[@]}"; exit 1; }
          mkdir -p dist
          cp "${debs[0]}" dist/
          echo "path=dist/$(basename "${debs[0]}")" >> "$GITHUB_OUTPUT"
          dpkg-deb --info "${debs[0]}"

      - name: Install test in a clean ubuntu:24.04 container
        run: bash desktop/packaging/linux/test-deb.sh "${{ steps.deb.outputs.path }}" ubuntu:24.04

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-deb
          path: dist/
          if-no-files-found: error
          retention-days: 14

  windows-nsis:
    name: Windows NSIS installer
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 90
    environment: release
    outputs:
      signed: ${{ steps.sign-check.outputs.signed }}
      updater: ${{ steps.updater.outputs.enabled }}
    env:
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      # RFC 3161 time-stamp server; override with the repository variable of the same name.
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: npm ci
        working-directory: desktop
        run: npm ci

      # Updater artifacts need plugins.updater.pubkey in tauri.conf.json (the key
      # the app trusts). Once it is there, a release without the private key fails
      # instead of silently shipping an installer the updater cannot verify.
      - name: Updater signing configuration
        id: updater
        run: |
          pubkey=$(python -c "import json; c=json.load(open('desktop/src-tauri/tauri.conf.json', encoding='utf-8')); print(bool(((c.get('plugins') or {}).get('updater') or {}).get('pubkey')))")
          if [ "$pubkey" = True ]; then
            [ "$HAS_UPDATER_KEY" = true ] || { echo "::error::plugins.updater.pubkey is set but secret TAURI_SIGNING_PRIVATE_KEY is missing"; exit 1; }
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::plugins.updater.pubkey is not set in tauri.conf.json: no updater artifacts or latest.json for this release"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import code-signing certificate
        id: cert
        if: env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password |
              Where-Object { $_.HasPrivateKey } | Select-Object -First 1
          } finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $pfx
          }
          if (-not $cert) { throw 'The PFX contains no certificate with a private key' }
          if ($cert.NotAfter -lt (Get-Date)) { throw "Code-signing certificate expired on $($cert.NotAfter)" }
          Write-Host "Signing as: $($cert.Subject) (valid until $($cert.NotAfter))"
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      # Merged over tauri.conf.json for this build only. With a thumbprint, Tauri
      # signs scribiva.exe, the uninstaller and the installer with signtool
      # (/fd sha256, RFC 3161 time stamp) before the updater signature is made.
      - name: Release build configuration
        env:
          THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
          UPDATER: ${{ steps.updater.outputs.enabled }}
        run: |
          python - "$RUNNER_TEMP/tauri.release.json" <<'PY'
          import json, os, sys
          bundle = {'createUpdaterArtifacts': os.environ['UPDATER'] == 'true'}
          if os.environ.get('THUMBPRINT'):
              bundle['windows'] = {
                  'certificateThumbprint': os.environ['THUMBPRINT'],
                  'digestAlgorithm': 'sha256',
                  'timestampUrl': os.environ['WINDOWS_TIMESTAMP_URL'],
                  'tsp': True,
              }
          with open(sys.argv[1], 'w', encoding='utf-8') as f:
              json.dump({'bundle': bundle}, f)
          print(json.dumps({'bundle': bundle}, indent=2))
          PY

      - name: Build NSIS installer
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.updater.outputs.enabled == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ steps.updater.outputs.enabled == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: npx tauri build --ci --bundles nsis --config "$RUNNER_TEMP/tauri.release.json" -- --locked

      - name: Collect artifacts
        id: exe
        run: |
          shopt -s nullglob
          exes=(desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)
          [ "${#exes[@]}" = 1 ] || { echo "::error::expected one installer, found ${#exes[@]}"; exit 1; }
          mkdir -p dist
          cp "${exes[0]}" dist/
          if [ "${{ steps.updater.outputs.enabled }}" = true ]; then
            [ -f "${exes[0]}.sig" ] || { echo "::error::updater signature ${exes[0]}.sig was not created"; exit 1; }
            cp "${exes[0]}.sig" dist/
          fi
          echo "path=dist/$(basename "${exes[0]}")" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Check Authenticode signature
        id: sign-check
        shell: pwsh
        env:
          INSTALLER: ${{ steps.exe.outputs.path }}
          EXPECT_SIGNED: ${{ env.HAS_WINDOWS_CERT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sig = Get-AuthenticodeSignature -FilePath $env:INSTALLER
          Write-Host "Status: $($sig.Status); signer: $($sig.SignerCertificate.Subject); timestamp: $($sig.TimeStamperCertificate.Subject)"
          if ($env:EXPECT_SIGNED -eq 'true') {
            if ($sig.Status -ne 'Valid') { throw "Installer signature is $($sig.Status)" }
            if (-not $sig.TimeStamperCertificate) { throw 'Installer signature has no time stamp' }
            "signed=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host '::warning::WINDOWS_CERTIFICATE is not configured: unsigned build, SmartScreen will warn'
            "signed=false" >> $env:GITHUB_OUTPUT
          }

      - name: Remove code-signing certificate
        if: always() && steps.cert.outputs.thumbprint != ''
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue "Cert:\CurrentUser\My\${{ steps.cert.outputs.thumbprint }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-nsis
          path: dist/
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Draft GitHub Release
    needs: [verify, linux-deb, windows-nsis]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.verify.outputs.version }}
      SIGNED: ${{ needs.windows-nsis.outputs.signed }}
      UPDATER: ${{ needs.windows-nsis.outputs.updater }}
      # Where users download from (and what latest.json points at). Defaults to
      # the GitHub release; set the repository variable to a mirror on the
      # Scribiva domain for mainland-China reachability (FR-015).
      DOWNLOAD_BASE_URL: ${{ vars.RELEASE_DOWNLOAD_BASE_URL || format('https://github.com/{0}/releases/download/{1}', github.repository, github.ref_name) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Updater manifest (latest.json)
        if: env.UPDATER == 'true'
        run: |
          shopt -s nullglob
          exes=(dist/*-setup.exe)
          [ "${#exes[@]}" = 1 ] || { echo "::error::expected one installer, found ${#exes[@]}"; exit 1; }
          {
            echo "Scribiva $VERSION"
            if [ "$SIGNED" != true ]; then echo; echo "Unsigned build — SmartScreen will warn."; fi
          } > "$RUNNER_TEMP/updater-notes.md"
          # The .deb is not listed: Linux updates come from the website/APT.
          python3 scripts/release/make_latest_json.py \
            --version "$TAG" \
            --notes-file "$RUNNER_TEMP/updater-notes.md" \
            --base-url "${DOWNLOAD_BASE_URL%/}" \
            --artifact "windows-x86_64=${exes[0]}" \
            --pubkey-file desktop/src-tauri/tauri.conf.json \
            --output dist/latest.json
          cat dist/latest.json

      - name: SHA256SUMS
        working-directory: dist
        run: |
          rm -f SHA256SUMS
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort | xargs -d '\n' sha256sum > SHA256SUMS
          cat SHA256SUMS
          sha256sum --check --strict SHA256SUMS

      - name: Release notes
        run: |
          deb=$(cd dist && ls *.deb)
          exe=$(cd dist && ls *-setup.exe)
          sum() { awk -v f="$1" '$2 == f { print $1 }' dist/SHA256SUMS; }
          base="${DOWNLOAD_BASE_URL%/}"
          # Annotated tag message (without a GPG signature); lightweight tags add nothing.
          message=""
          if [ "$(git cat-file -t "refs/tags/$TAG" 2>/dev/null)" = tag ]; then
            message=$(git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG")
          fi
          {
            echo "## Scribiva $VERSION"
            echo
            if [ "$SIGNED" != true ]; then
              echo "> [!WARNING]"
              echo "> **Unsigned build — SmartScreen will warn.** The Windows installer has no Authenticode signature (WINDOWS_CERTIFICATE was not configured)."
              echo
            fi
            if [ -n "${message//[[:space:]]/}" ]; then echo "$message"; echo; fi
            echo "| File | SHA-256 |"
            echo "|---|---|"
            echo "| \`$exe\` | \`$(sum "$exe")\` |"
            echo "| \`$deb\` | \`$(sum "$deb")\` |"
            echo
            echo "Verify: \`sha256sum --check --ignore-missing SHA256SUMS\` (Linux) or \`Get-FileHash -Algorithm SHA256 $exe\` (Windows)."
            echo
            echo "The Linux .deb is updated through the website/APT, not the in-app updater."
            if [ "$UPDATER" = true ]; then
              echo "\`latest.json\` (Tauri updater manifest) covers Windows only."
            else
              echo "No \`latest.json\`: the in-app updater is not configured (plugins.updater.pubkey)."
            fi
            echo
            echo "<details><summary>landing/assets/config.js values for this release</summary>"
            echo
            echo '```js'
            echo "  release_state: \"available\","
            echo "  version: \"$VERSION\","
            echo "  windows_url: \"$base/$exe\","
            echo "  windows_sha256: \"$(sum "$exe")\","
            echo "  linux_deb_url: \"$base/$deb\","
            echo "  linux_deb_sha256: \"$(sum "$deb")\""
            echo '```'
            echo
            echo "</details>"
            echo
            echo "Built from \`$GITHUB_SHA\` by [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      # Always a draft. Re-running the workflow refreshes the assets of an
      # existing draft but never touches a release that was already published.
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            [ "$draft" = true ] || { echo "::error::Release $TAG is already published; not modifying it"; exit 1; }
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=true --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "Scribiva $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          fi
          echo "Draft release ready: review it at $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases and publish by hand." >> "$GITHUB_STEP_SUMMARY"
