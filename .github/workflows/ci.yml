name: CI

on:
  push:
    branches: [main, v1-dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Verified locally with this toolchain; bump deliberately (new clippy lints).
  RUST_TOOLCHAIN: "1.96.1"
  NODE_VERSION: "24"

jobs:
  python:
    name: Python (ruff, unittest, shell tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ffmpeg (FLAC tests) and venv
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg python3-venv

      - name: Install ruff (pinned, hash-checked)
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet --require-hashes --only-binary :all: \
            -r .github/ci-requirements.txt
          echo "$RUNNER_TEMP/lint/bin" >> "$GITHUB_PATH"

      - name: ruff
        run: ruff check src server tests scripts/release

      - name: Unit tests
        run: PYTHONPATH=src:server python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Release script tests
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py'

      - name: Installer smoke test
        run: bash tests/test_install.sh

      - name: Simulated end-to-end workflow
        run: bash tests/test_e2e_simulated.sh

  desktop-linux:
    name: Desktop (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri 2 build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential pkg-config file patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libdbus-1-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri -> target
          save-if: ${{ github.event_name == 'push' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: npm ci
        working-directory: desktop
        run: npm ci

      - name: Build frontend (tsc + vite)
        working-directory: desktop
        run: npm run build

      - name: cargo fmt
        working-directory: desktop/src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test --locked

  desktop-windows:
    name: Desktop (Windows)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri -> target
          save-if: ${{ github.event_name == 'push' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: npm ci
        working-directory: desktop
        run: npm ci

      - name: Build frontend (tsc + vite)
        working-directory: desktop
        run: npm run build

      - name: cargo clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test --locked

  extension:
    name: GNOME Shell extension
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXT: extensions/gnome-shell/scribiva@scribiva.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # GJS extensions are ES modules. Plain `node --check file.js` may fall back to
      # CommonJS-with-detection and miss syntax errors after an `export`, so the
      # module goal is forced. Only syntax is checked; gi:// imports are not resolved.
      - name: JavaScript syntax (loader + implementation)
        run: |
          for f in "$EXT"/*.js; do
            node --input-type=module --check < "$f"
            echo "syntax OK: $f"
          done

      - name: metadata.json and zip contents
        run: |
          python3 scripts/release/check_extension.py "$EXT" \
            --zip "$RUNNER_TEMP/scribiva@scribiva.app.shell-extension.zip"
          python3 -m zipfile -l "$RUNNER_TEMP/scribiva@scribiva.app.shell-extension.zip"

  landing:
    name: Landing page
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: HTML well-formedness, relative links, no external resources
        run: python3 scripts/release/check_landing.py landing

      - name: JavaScript syntax (classic scripts)
        run: |
          for f in landing/assets/*.js; do
            node --input-type=commonjs --check < "$f"
            echo "syntax OK: $f"
          done
